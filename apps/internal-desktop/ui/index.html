<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partnera Internal OS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #141822;
        --border: #232838;
        --text: #e6e8ee;
        --muted: #9aa2b4;
        --accent: #6366f1;
        --danger: #ffb4c0;
        --danger-bg: #3a1620;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: 100%; max-width: 420px; padding: 32px; text-align: center; }
      .brand {
        display: flex; align-items: center; justify-content: center;
        gap: 12px; margin-bottom: 28px;
      }
      .mark {
        width: 36px; height: 36px; border-radius: 9px;
        background: var(--accent);
      }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      .spinner {
        width: 34px; height: 34px; margin: 0 auto 20px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { color: var(--muted); font-size: 14px; min-height: 20px; }
      .steps { margin-top: 22px; text-align: left; display: inline-block; }
      .step { color: #4b5262; font-size: 12.5px; margin: 5px 0; transition: color .2s; }
      .step.active { color: var(--text); }
      .step.done { color: #46c08a; }
      .step::before { content: "○ "; }
      .step.active::before { content: "◐ "; }
      .step.done::before { content: "● "; }

      #error { display: none; text-align: left; }
      #error.show { display: block; }
      .err-card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 20px;
      }
      .err-title { font-size: 15px; font-weight: 650; margin: 0 0 8px; color: var(--danger); }
      .err-msg { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.5; }
      .btns { display: flex; gap: 10px; }
      button {
        flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
        background: #1b2130; color: var(--text); font-size: 13px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button:hover { filter: brightness(1.1); }
      .foot { color: #5b6270; font-size: 11px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <div id="loading">
        <div class="brand"><span class="mark"></span><h1>Partnera Internal OS</h1></div>
        <div class="spinner"></div>
        <div id="status">Starting Partnera Internal OS…</div>
        <div class="steps">
          <div class="step active" data-step="runtime">Checking secure runtime…</div>
          <div class="step" data-step="services">Connecting to Partnera services…</div>
          <div class="step" data-step="permissions">Loading permissions…</div>
        </div>
      </div>

      <div id="error">
        <div class="brand"><span class="mark"></span><h1>Partnera Internal OS</h1></div>
        <div class="err-card">
          <p class="err-title" id="err-title">Could not start</p>
          <p class="err-msg" id="err-msg"></p>
          <div class="btns">
            <button class="primary" id="retry">Retry</button>
            <button id="open-logs">Open logs</button>
          </div>
        </div>
      </div>

      <div class="foot">Private build · loopback runtime · platform operators only</div>
    </main>

    <script>
      // The Rust supervisor drives this splash by emitting events. No Tauri IPC
      // permission is required to LISTEN to events from the backend.
      const steps = document.querySelectorAll(".step");
      function markStep(name, state) {
        for (const el of steps) {
          if (el.dataset.step === name) {
            el.classList.remove("active", "done");
            if (state) el.classList.add(state);
          }
        }
      }
      function setStatus(text) {
        const s = document.getElementById("status");
        if (s) s.textContent = text;
      }
      function showError(title, message) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").classList.add("show");
        document.getElementById("err-title").textContent = title || "Could not start";
        document.getElementById("err-msg").textContent = message || "An unexpected error occurred.";
      }

      async function wire() {
        // The Tauri event API is injected on the tauri:// origin (splash) even
        // without withGlobalTauri, via the core event listener. Guard for safety.
        const tauri = window.__TAURI__;
        if (!tauri || !tauri.event || !tauri.core) return;
        const { listen } = tauri.event;
        const { invoke } = tauri.core;

        await listen("boot://status", (e) => {
          const p = e.payload || {};
          if (p.status) setStatus(p.status);
          if (p.step) markStep(p.step, p.state || "active");
        });
        await listen("boot://error", (e) => {
          const p = e.payload || {};
          showError(p.title, p.message);
        });

        document.getElementById("retry").addEventListener("click", () => {
          document.getElementById("error").classList.remove("show");
          document.getElementById("loading").style.display = "block";
          markStep("runtime", "active");
          markStep("services", null);
          markStep("permissions", null);
          invoke("retry_boot").catch(() => {});
        });
        document.getElementById("open-logs").addEventListener("click", () => {
          invoke("open_logs_dir").catch(() => {});
        });
      }
      wire();
    </script>
  </body>
</html>
