[package]
name = "partnera-internal-desktop"
version = "0.2.2"
description = "Partnera Internal OS — private Windows desktop wrapper"
authors = ["Partnera"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "partnera_internal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` powers the tray menu, which is the operator's only way to trigger
# a MANUAL update check (the loopback admin panel has no Tauri IPC).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# Automatic updates: checks a signed manifest, downloads and installs the new
# signed package natively. Driven from Rust (see src/updater.rs).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
