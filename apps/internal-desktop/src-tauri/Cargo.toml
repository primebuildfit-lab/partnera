[package]
name = "partnera-internal-desktop"
version = "0.1.0"
description = "Partnera Internal OS — private Windows desktop wrapper"
authors = ["Partnera"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "partnera_internal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
