# Partnera Affiliate (desktop) — build, sign and publish an auto-updatable release.
#
# PREPARED INFRASTRUCTURE: dormant until this repo has a GitHub remote and the
# signing secret below is set. It builds apps/affiliate-desktop, signs the updater
# artifacts with the private key held ONLY in repo secrets, publishes a GitHub
# Release with the installer + `.sig`, and then repoints the rolling channel
# release that installed clients actually poll.
#
# Trigger: push a tag like `partnera-affiliate-v0.1.1` (or run manually).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PARTNERA_AFFILIATE_SIGNING_KEY   full contents of .secrets-tauri/affiliate-updater.key
#                                    (no password secret needed — this key has none)
#   PARTNERA_RELEASES_TOKEN          PAT with `repo` scope on RELEASES_REPO below.
#                                    The built-in GITHUB_TOKEN is scoped to THIS
#                                    repository only and cannot publish into the
#                                    separate public releases repo.
#
# KEY ISOLATION: this app has its OWN keypair (minisign 9365EE8087376568). Do not
# reuse another Partnera app's key here, and do not reuse this one elsewhere — a
# shared key lets one product's package be accepted by another product's client.
# The public half in apps/affiliate-desktop/src-tauri/tauri.conf.json
# (plugins.updater.pubkey) MUST match this private key, or installed apps reject
# every update.
#
# CHANNEL DESIGN: several Partnera products publish from this same repository, so
# `releases/latest/download/...` is NOT a safe manifest URL — "latest" is whichever
# product released most recently. Installed affiliate clients instead poll the
# fixed tag `partnera-affiliate-channel-stable`, which carries only this product's
# `affiliate-latest.json` and is repointed by the last job below. The download URLs
# inside that manifest reference the immutable per-version release assets.

name: release-partnera-affiliate

on:
  push:
    tags:
      - "partnera-affiliate-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. partnera-affiliate-v0.1.1)"
        required: true

permissions:
  contents: write

env:
  CHANNEL_TAG: partnera-affiliate-channel-stable
  # The PUBLIC releases repository. This source repo is private, and GitHub only
  # serves a private repo's release assets to authenticated callers — the updater
  # downloads with no credentials, so the channel must live in a public repo.
  # It holds signed installers and manifests only; no source code.
  RELEASES_REPO: primebuildfit-lab/partnera-releases
  RELEASES_OWNER: primebuildfit-lab
  RELEASES_NAME: partnera-releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/affiliate-desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — app version must match the tag
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          WANT="${TAG#partnera-affiliate-v}"
          CONF=$(node -p "require('./apps/affiliate-desktop/src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' apps/affiliate-desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          PKG=$(node -p "require('./apps/affiliate-desktop/package.json').version")
          echo "tag=$WANT tauri.conf=$CONF Cargo=$CARGO package.json=$PKG"
          if [ "$CONF" != "$WANT" ] || [ "$CARGO" != "$WANT" ] || [ "$PKG" != "$WANT" ]; then
            echo "::error::Version mismatch — bump tauri.conf.json, Cargo.toml and package.json to $WANT before tagging."
            exit 1
          fi

      # Build and sign only — publishing happens below, into the separate public
      # releases repo, which tauri-action cannot target.
      - name: Build and sign the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PARTNERA_AFFILIATE_SIGNING_KEY }}
          # Baked into the binary so the installed app polls the PUBLIC channel.
          PARTNERA_UPDATE_OWNER: ${{ env.RELEASES_OWNER }}
          PARTNERA_UPDATE_REPO: ${{ env.RELEASES_NAME }}
        with:
          projectPath: apps/affiliate-desktop
          args: --config src-tauri/tauri.conf.release.json

      - name: Publish the release and repoint the rolling channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PARTNERA_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          VERSION="${TAG#partnera-affiliate-v}"
          BUNDLE="apps/affiliate-desktop/src-tauri/target/release/bundle/nsis"

          EXE=$(ls "$BUNDLE"/*_x64-setup.exe)
          SIG=$(ls "$BUNDLE"/*_x64-setup.exe.sig)
          ASSET=$(basename "$EXE" | tr ' ' '-')
          cp "$EXE" "$ASSET"
          export VERSION SIG TAG ASSET

          # The versioned release holds the immutable installer.
          gh release create "$TAG" "$ASSET" "$SIG" \
            --repo "$RELEASES_REPO" \
            --title "Partnera Affiliate $VERSION" \
            --notes "Partnera Affiliate desktop $VERSION.

          Instalación nueva: descarga y ejecuta el instalador \`.exe\`.
          Actualización: las instalaciones existentes se actualizan solas al abrir
          la app (se descarga, se verifica la firma, se instala y se reinicia).
          También se puede comprobar desde **Ayuda → Buscar actualizaciones…**."

          # The manifest points at that immutable asset.
          node -e "
            const fs = require('fs');
            const m = {
              version: process.env.VERSION,
              notes: 'Partnera Affiliate ' + process.env.VERSION,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync(process.env.SIG, 'utf8').trim(),
                  url: 'https://github.com/' + process.env.RELEASES_REPO +
                       '/releases/download/' + process.env.TAG + '/' + process.env.ASSET,
                },
              },
            };
            if (!m.platforms['windows-x86_64'].signature) throw new Error('empty signature');
            fs.writeFileSync('affiliate-latest.json', JSON.stringify(m, null, 2));
            console.log('manifest ->', m.version);
          "

          # The rolling channel tag is what installed clients poll.
          if ! gh release view "$CHANNEL_TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" \
              --repo "$RELEASES_REPO" \
              --title "Partnera Affiliate — canal estable" \
              --notes "Manifiesto que consultan las instalaciones de Partnera Affiliate. Se reapunta en cada release; no contiene instaladores." \
              --latest=false
          fi
          gh release upload "$CHANNEL_TAG" affiliate-latest.json --clobber --repo "$RELEASES_REPO"

      - name: Verify the published manifest is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${RELEASES_REPO}/releases/download/${CHANNEL_TAG}/affiliate-latest.json"
          echo "polling $URL"
          curl -fsSL --retry 5 --retry-delay 5 "$URL" | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=JSON.parse(s);
              console.log('channel serves version', m.version);
            });
          "
