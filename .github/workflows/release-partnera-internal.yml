# Partnera Internal OS (desktop) — build, sign and publish an auto-updatable release.
#
# Trigger: push a tag like `partnera-internal-v0.2.2` (or run manually).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PARTNERA_INTERNAL_SIGNING_KEY    full contents of ~/.partnera/updater.key
#                                    (minisign 8ADBA54F419376D9, no password).
#   PARTNERA_RELEASES_TOKEN          PAT with `repo` scope on RELEASES_REPO below.
#                                    The built-in GITHUB_TOKEN is scoped to THIS
#                                    repository only and cannot publish into the
#                                    separate public releases repo.
#
# WHY A SEPARATE RELEASES REPO: this source repo is PRIVATE. The Tauri updater
# downloads its manifest and installer UNAUTHENTICATED, so release assets have to
# live in a public repo. That repo holds only signed installers and manifests.
#
# KEY ISOLATION: this app has its OWN keypair (minisign 8ADBA54F419376D9). Do not
# reuse another Partnera app's key here, and do not reuse this one elsewhere — a
# shared key lets one product's package be accepted by another product's client.
# The public half in apps/internal-desktop/src-tauri/tauri.conf.json
# (plugins.updater.pubkey) MUST match this private key, or installed apps reject
# every update.
#
# CHANNEL DESIGN: several Partnera products publish from this same repository, so
# `releases/latest/download/...` is NOT a safe manifest URL — "latest" is whichever
# product released most recently. Installed Internal OS clients instead poll the
# fixed tag `partnera-internal-channel-stable`, which carries only this product's
# `internal-latest.json` and is repointed by the last step below. The download URLs
# inside that manifest reference the immutable per-version release assets.

name: release-partnera-internal

on:
  push:
    tags:
      - "partnera-internal-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. partnera-internal-v0.2.2)"
        required: true

permissions:
  contents: read

env:
  CHANNEL_TAG: partnera-internal-channel-stable
  RELEASES_REPO: primebuildfit-lab/partnera-releases
  RELEASES_OWNER: primebuildfit-lab
  RELEASES_NAME: partnera-releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/internal-desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The desktop sidecar is esbuild-bundled from packages/web, which imports
      # the @partnera/* workspace packages by their `dist/index.js`. Those are
      # tsc build outputs and are not in git, so without this the bundle step
      # fails with "Could not resolve @partnera/core". Locally it only works
      # because dist/ is left over from a previous build.
      - name: Build workspace packages
        run: pnpm build

      - name: Guard — app version must match the tag
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          WANT="${TAG#partnera-internal-v}"
          CONF=$(node -p "require('./apps/internal-desktop/src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' apps/internal-desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          PKG=$(node -p "require('./apps/internal-desktop/package.json').version")
          echo "tag=$WANT tauri.conf=$CONF Cargo=$CARGO package.json=$PKG"
          if [ "$CONF" != "$WANT" ] || [ "$CARGO" != "$WANT" ] || [ "$PKG" != "$WANT" ]; then
            echo "::error::Version mismatch — bump tauri.conf.json, Cargo.toml and package.json to $WANT before tagging."
            exit 1
          fi

      # Build and sign only — publishing happens below, into the separate public
      # releases repo.
      #
      # This calls the Tauri CLI directly rather than using tauri-action: that
      # action detects the package manager from a lockfile next to projectPath,
      # finds none in this monorepo app dir, falls back to `npm run tauri` and
      # dies on "Missing script: tauri". `pnpm exec` is also exactly the command
      # used locally, so CI and local builds cannot drift.
      #
      # `beforeBuildCommand` in tauri.conf.json runs `pnpm prepare:runtime`,
      # which bundles server.cjs, stages this runner's node.exe as the bundled
      # runtime, and validates both before the Rust build starts.
      - name: Build and sign the desktop app
        shell: bash
        working-directory: apps/internal-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PARTNERA_INTERNAL_SIGNING_KEY }}
          # The key has no password; the CLI still expects the variable to exist.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Baked into the binary so the installed app polls the PUBLIC channel.
          PARTNERA_UPDATE_OWNER: ${{ env.RELEASES_OWNER }}
          PARTNERA_UPDATE_REPO: ${{ env.RELEASES_NAME }}
        run: pnpm exec tauri build --config src-tauri/tauri.conf.release.json

      - name: Publish the release and repoint the rolling channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PARTNERA_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          VERSION="${TAG#partnera-internal-v}"
          BUNDLE="apps/internal-desktop/src-tauri/target/release/bundle/nsis"

          EXE=$(ls "$BUNDLE"/*_x64-setup.exe)
          SIG=$(ls "$BUNDLE"/*_x64-setup.exe.sig)
          ASSET=$(basename "$EXE" | tr ' ' '-')
          cp "$EXE" "$ASSET"
          export VERSION SIG TAG ASSET

          # The versioned release holds the immutable installer.
          gh release create "$TAG" "$ASSET" "$SIG" \
            --repo "$RELEASES_REPO" \
            --title "Partnera Internal OS $VERSION" \
            --notes "Partnera Internal OS desktop $VERSION.

          Instalación nueva: descarga y ejecuta el instalador \`.exe\`.
          Actualización: las instalaciones existentes se actualizan solas al abrir
          la app (se descarga, se verifica la firma, se instala y se reinicia).
          También se puede comprobar desde la bandeja del sistema →
          **Buscar actualizaciones…**."

          # The manifest points at that immutable asset.
          node -e "
            const fs = require('fs');
            const m = {
              version: process.env.VERSION,
              notes: 'Partnera Internal OS ' + process.env.VERSION,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync(process.env.SIG, 'utf8').trim(),
                  url: 'https://github.com/' + process.env.RELEASES_REPO +
                       '/releases/download/' + process.env.TAG + '/' + process.env.ASSET,
                },
              },
            };
            if (!m.platforms['windows-x86_64'].signature) throw new Error('empty signature');
            fs.writeFileSync('internal-latest.json', JSON.stringify(m, null, 2));
            console.log('manifest ->', m.version);
          "

          # The rolling channel tag is what installed clients poll.
          if ! gh release view "$CHANNEL_TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" \
              --repo "$RELEASES_REPO" \
              --title "Partnera Internal OS — canal estable" \
              --notes "Manifiesto que consultan las instalaciones de Partnera Internal OS. Se reapunta en cada release; no contiene instaladores." \
              --latest=false
          fi
          gh release upload "$CHANNEL_TAG" internal-latest.json --clobber --repo "$RELEASES_REPO"

      - name: Verify the published manifest is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${RELEASES_REPO}/releases/download/${CHANNEL_TAG}/internal-latest.json"
          echo "polling $URL"
          curl -fsSL --retry 5 --retry-delay 5 "$URL" | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const m=JSON.parse(s);
              console.log('channel serves version', m.version);
            });
          "
